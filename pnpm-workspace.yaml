packages:
  - "packages/*"

# Required for `pnpm deploy` (Docker prod build) since pnpm 10, and the correct
# behavior once packages/core becomes a workspace dependency — workspace deps are
# hard-linked into the deployed node_modules rather than symlinked.
injectWorkspacePackages: true

# pnpm 11 requires an explicit allow/deny per dependency build script. Both were
# already skipped under pnpm 10 (no build config) and aren't on the build path —
# tsdown bundles via rolldown and the published artifact is prebuilt dist/.
allowBuilds:
  esbuild: false
  tldjs: false

# Force the patched Vite line. vite is transitive (vitest 4.x, dev-only) and the
# vulnerable versions (<7.3.2) are dev-server CVEs not reachable here, but this keeps
# the lockfile clean of the advisories. vitest 4.1.8 allows ^6 || ^7 || ^8; pin 7.x.
overrides:
  vite: "^7.3.2"
  # Pin a single functype across the workspace. somamcp pulls 1.4.4 while our packages
  # ask for ^1.4.3; two copies of functype's structurally-recursive Either type make
  # tsc blow the instantiation budget (TS2589). 1.4.4 satisfies every ^1.4.3 range.
  functype: "1.4.4"
  # Clears GHSA-7p8r-x3mc-p8w7 and GHSA-v2hh-gcrm-f6hx (both high, both host confusion via
  # backslash authority delimiters). fast-uri arrives transitively as ajv -> @modelcontextprotocol
  # /sdk -> fastmcp/somamcp, and ajv 8.20.0 still asks for the vulnerable 3.1.3, so bumping the
  # leaf packages does not move it — only a root override does (overrides are root-only, which is
  # also why this cannot be fixed inside somamcp). ajv wants ^3.0.1, so ^3.1.5 satisfies it.
  #
  # Housekeeping, not exposure: the CVEs need fast-uri to make a host-policy decision that is then
  # acted on by WHATWG URL/fetch, and ajv only uses it to resolve JSON Schema $id/$ref. Revisit if
  # this server ever grows a URL allowlist or redirect follower.
  fast-uri: "^3.1.5"
  # Hold mcp-proxy below 6.7. fastmcp declares "^6.4.6" (unchanged across 4.12.6, 4.16.8 and
  # 4.17.1), so a routine lockfile refresh floats it into 6.7.x, where mcp-proxy swapped
  # @modelcontextprotocol/sdk for @modelcontextprotocol/server@2. Those two model protocol
  # versions differently: sdk 1.x keeps them in module constants, server 2.x reads
  # `this._supportedProtocolVersions` off the instance. fastmcp still builds its Server from
  # sdk 1.x, so 6.7.x hands a gen-1 object to gen-2 code and installDiscoverHandler throws on
  # every session negotiating 2025-11-25 or 2026-07-28 — which current Claude clients send.
  #
  # Not fatal here (sessions establish and tools work), but writeClientIdentity never runs, so
  # client capabilities are lost and the logs fill with stack traces. Confirmed on 6.7.10 and
  # 6.7.11; 6.6.0 predates the swap and declares only pipenet.
  #
  # REMOVE WHEN punkpeye/mcp-proxy#96 is fixed and released. Watch that issue — nothing local
  # will tell you: dependabot only sees direct deps, and the suite passes either way.
  mcp-proxy: "~6.6.0"
publicHoistPattern:
  - "*eslint*"
  - "*prettier*"
  - "*vitest*"
  - "typescript"
  - "*rimraf*"
  - "*cross-env*"
minimumReleaseAgeExclude:
  - somamcp@1.1.0 || 1.3.2
  - fastmcp@4.17.1
patchedDependencies:
  '@azure/identity@4.13.2': patches/@azure__identity@4.13.2.patch
