packages:
  - "packages/*"

# Required for `pnpm deploy` (Docker prod build) since pnpm 10, and the correct
# behavior once packages/core becomes a workspace dependency — workspace deps are
# hard-linked into the deployed node_modules rather than symlinked.
injectWorkspacePackages: true

# pnpm 11 requires an explicit allow/deny per dependency build script. Both were
# already skipped under pnpm 10 (no build config) and aren't on the build path —
# tsdown bundles via rolldown and the published artifact is prebuilt dist/.
allowBuilds:
  esbuild: false
  tldjs: false

# Force the patched Vite line. vite is transitive (vitest 4.x, dev-only) and the
# vulnerable versions (<=7.3.6) are dev-server CVEs not reachable here, but this keeps
# the lockfile clean of the advisories. vitest 4.1.8 allows ^6 || ^7 || ^8; pin 7.x.
overrides:
  vite: "^7.3.7"
  # Clears GHSA-7p8r-x3mc-p8w7 and GHSA-v2hh-gcrm-f6hx (both high, both host confusion via
  # backslash authority delimiters). fast-uri arrives transitively as ajv -> @modelcontextprotocol
  # /sdk -> fastmcp/somamcp, and ajv 8.20.0 still asks for the vulnerable 3.1.3, so bumping the
  # leaf packages does not move it — only a root override does (overrides are root-only, which is
  # also why this cannot be fixed inside somamcp). ajv wants ^3.0.1, so ^3.1.8 satisfies it
  # (3.1.8 also clears the later 3.1.6/3.1.7 advisories).
  #
  # Housekeeping, not exposure: the CVEs need fast-uri to make a host-policy decision that is then
  # acted on by WHATWG URL/fetch, and ajv only uses it to resolve JSON Schema $id/$ref. Revisit if
  # this server ever grows a URL allowlist or redirect follower.
  fast-uri: "^3.1.8"
  # Dev-only (eslint -> minimatch 10). `pnpm update --depth Infinity` leaves the 5.x line on
  # 5.0.7 even though minimatch allows ^5.0.5, so pin the patched release for that line only.
  "brace-expansion@>=5.0.0 <5.0.12": "^5.0.12"
  # Dev-only, both via vite (vitest). Same pnpm update gap as above. vite 7.3.7 allows
  # postcss ^8.5.6 and esbuild ^0.27.0 || ^0.28.0, so these stay inside its ranges.
  postcss: "^8.5.23"
  esbuild: "^0.28.1"
  # Clears GHSA-mrwp-f3q8-3g9p (high, 1.16.0-1.16.1). Runtime: fastmcp -> mcp-proxy -> pipenet ->
  # axios 1.20.0, which asks for ^1.15.11 and so stays on 1.16.1 without this.
  follow-redirects: "^1.16.2"
publicHoistPattern:
  - "*eslint*"
  - "*prettier*"
  - "*vitest*"
  - "typescript"
  - "*rimraf*"
  - "*cross-env*"
minimumReleaseAgeExclude:
  - somamcp@1.1.0 || 1.3.2 || 1.4.0 || 2.1.0
  - fastmcp@4.17.1 || 4.20.2
  - mcp-proxy@6.7.12 || 6.7.13
