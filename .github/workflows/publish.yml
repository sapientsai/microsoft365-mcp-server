name: Publish to NPM

on:
  push:
    tags:
      - "v*"

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write # OIDC for npm trusted publishing

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: ".nvmrc"
          registry-url: "https://registry.npmjs.org"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Validate
        run: pnpm run ci

      - name: Verify package contents
        working-directory: packages/microsoft365
        run: |
          echo "Files to be published:"
          npm pack --dry-run

      # Before the release and the publish: a tarball npm cannot install must never be released.
      - name: Check the package installs from npm
        working-directory: packages/microsoft365
        run: node scripts/check-npm-install.mjs

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to npm
        working-directory: packages/microsoft365
        run: npm publish --provenance --access public

  # A separate job, so a failed bundle build can't hold up or fail the npm publish, and
  # "Re-run failed jobs" retries only this part.
  mcpb:
    needs: publish
    permissions:
      contents: write
    uses: ./.github/workflows/mcpb.yml
    with:
      tag: ${{ github.ref_name }}
