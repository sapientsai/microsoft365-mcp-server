name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

# A newer push to a pull request cancels the build it supersedes. A push to main gets a group of its own,
# because GitHub cancels a waiting run when a newer one joins its group, even with cancel-in-progress off.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v6.1.0
        name: Install pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run CI Pipeline
        run: pnpm run ci

      # server.json carries the version into the MCP Registry. prepublishOnly checks it
      # too, but that fires on the tag, where a failure has already cut a GitHub Release.
      - name: Check server.json is in step with package.json
        working-directory: packages/microsoft365
        run: node scripts/sync-server-json.mjs --check

      # Installs the packed artifact with plain npm, outside the workspace. validate cannot catch a
      # manifest npm cannot install: every check it runs resolves dependencies through pnpm.
      - name: Check the package installs from npm
        run: node packages/microsoft365/scripts/check-npm-install.mjs
