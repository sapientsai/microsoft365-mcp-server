name: Node.js CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        name: Install pnpm

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run CI Pipeline
        run: pnpm run validate

      # Installs the packed artifact with plain npm, outside the workspace. validate cannot catch a
      # manifest npm cannot install: every check it runs resolves dependencies through pnpm.
      - name: Check the package installs from npm
        run: node packages/microsoft365/scripts/check-npm-install.mjs
