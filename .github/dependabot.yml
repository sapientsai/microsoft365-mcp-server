# To get started with Dependabot version updates, you'll need to specify which
# package ecosystems to update and where the package manifests are located.
# Please see the documentation for all configuration options:
# https://docs.github.com/github/administering-a-repository/configuration-options-for-dependency-updates

version: 2
updates:
  - package-ecosystem: "npm" # See documentation for possible values
    directory: "/" # Location of package manifests
    schedule:
      interval: "weekly"
    ignore:
      # @types/node tracks the runtime: .nvmrc pins Node 24 and engines require >=24. Types for a newer
      # major typecheck APIs that do not exist at runtime, and nothing else here would catch that.
      # Raise it together with .nvmrc instead.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    # One weekly PR for every minor and patch bump, instead of one PR each. Majors still come one
    # at a time, because each needs its own look.
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
